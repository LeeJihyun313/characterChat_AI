<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI들이 나를 가만두지 않는다</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>AI들이 나를 가만두지 않는다</h1>
      <p>사용자가 AI를 고르는 게 아니라, AI가 사용자를 고릅니다.</p>
    </header>

    <main id="chat" class="chat">
      <div class="message system">
        <strong>📡 System</strong>
        <p>AI 선택권은 없습니다. 입력하면 알아서 누군가 튀어나옵니다.</p>
      </div>
    </main>

    <footer class="input-area">
      <input id="input" placeholder="예: 1+1 뭐야? / 뭐 먹지? / 답만 알려줘" />
      <button id="sendButton">전송</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
